# Opens the app every 6 hours so Streamlit Community Cloud never puts it to sleep,
# and visits the heavy pages so their machine-learning results are already cached for real visitors.
name: Keep the app awake
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a headless browser
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Visit the app
        env:
          APP_URL: https://cairo-metro-ad-planner-mwzqpnn7ozdv8uubvti5wu.streamlit.app
        run: |
          python - <<'PY'
          import os, time
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"].rstrip("/")
          with sync_playwright() as p:
              page = p.chromium.launch().new_page()
              page.goto(url, timeout=120_000)
              time.sleep(10)
              # a sleeping app shows a wake-up button instead of the app
              wake = page.get_by_role("button", name="Yes, get this app back up!")
              if wake.count():
                  print("App was asleep: waking it up")
                  wake.first.click()
                  time.sleep(90)
              for path in ("", "/forecast", "/insights", "/network"):
                  page.goto(url + path, timeout=120_000)
                  time.sleep(45)  # long enough for the page to load its data and train/cache its models
                  print("visited", url + path)
          PY
